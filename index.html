    <script>
        // Global App State
        let currentUser = null;
        let currentRole = null;
        let authToken = null;
        let activeView = 'login';

        // Initialize Lucide Icons on load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkExistingSession();
        });

        function checkExistingSession() {
            const savedUser = localStorage.getItem('ieee_user');
            const savedToken = localStorage.getItem('ieee_token');
            if (savedUser && savedToken) {
                try {
                    currentUser = JSON.parse(savedUser);
                    authToken = savedToken;
                    currentRole = currentUser.role || 'CONTESTANT';
                    renderDashboard();
                } catch(e) {
                    localStorage.clear();
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> جاري التحقق...`;
            errorDiv.classList.add('hidden');

            try {
                // Simulate production API authentication request
                // In production, this calls /api/auth/login via Vercel Serverless Middleware
                await new Promise(r => setTimeout(r, 800));

                // Mock Authentication logic for robust deployment showcase
                if (username === 'admin' && password === 'admin123') {
                    currentUser = { id: '001', name: 'مدير النظام العام', username: 'admin', role: 'ADMIN', teamId: '-' };
                } else if (username === 'buffet' && password === 'buffet123') {
                    currentUser = { id: '002', name: 'موظف البوفية والضيافة', username: 'buffet', role: 'BUFFET', teamId: '-' };
                } else if (username === 'contestant' && password === 'user123') {
                    currentUser = { id: '003', name: 'أحمد محمد (فريق 07)', username: 'contestant', role: 'CONTESTANT', teamId: 'Team 07' };
                } else if (username === 'inventory' && password === 'inv123') {
                    currentUser = { id: '004', name: 'مسؤول المخزن المركزي', username: 'inventory', role: 'INVENTORY', teamId: '-' };
                } else if (username === 'security' && password === 'sec123') {
                    currentUser = { id: '005', name: 'ضابط أمن القاعة', username: 'security', role: 'SECURITY', teamId: '-' };
                } else if (username === 'it' && password === 'it123') {
                    currentUser = { id: '006', name: 'مهندس الدعم الفني للشبكات', username: 'IT_SUPPORT', teamId: '-' };
                } else if (username === 'medic' && password === 'med123') {
                    currentUser = { id: '007', name: 'مسعف الطوارئ الميداني', username: 'FIRST_AID', teamId: '-' };
                } else if (username === 'reception' && password === 'rec123') {
                    currentUser = { id: '008', name: 'موظف الاستقبال والتسجيل', username: 'RECEPTION', teamId: '-' };
                } else if (username === 'services' && password === 'ser123') {
                    currentUser = { id: '009', name: 'مشرف الخدمات العامة', username: 'SERVICES_SUPERVISOR', teamId: '-' };
                } else {
                    throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة. استخدم الحسابات التجريبية الموثقة.');
                }

                authToken = 'mock_jwt_token_' + Date.now();
                currentRole = currentUser.role;
                localStorage.setItem('ieee_user', JSON.stringify(currentUser));
                localStorage.setItem('ieee_token', authToken);

                renderDashboard();
            } catch (err) {
                errorText.textContent = err.message || 'حدث خطأ أثناء الاتصال بالخادم.';
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<span>تسجيل الدخول</span><i data-lucide="arrow-left" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        }

        function handleLogout() {
            localStorage.clear();
            currentUser = null;
            currentRole = null;
            authToken = null;
            location.reload();
        }

        function renderDashboard() {
            const container = document.getElementById('app');
            
            if (currentRole === 'CONTESTANT') {
                container.innerHTML = renderContestantView();
            } else if (currentRole === 'ADMIN') {
                container.innerHTML = renderAdminView();
            } else if (currentRole === 'BUFFET') {
                container.innerHTML = renderBuffetView();
            } else if (currentRole === 'INVENTORY') {
                container.innerHTML = renderInventoryView();
            } else {
                container.innerHTML = renderGenericStaffView();
            }
            lucide.createIcons();
        }
